CONFIG_ZMK_DISPLAY=y
ZMK_WIDGET_BATTERY_STATUS
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Connexion split : intervalle 7,5 ms (unités de 1,25 ms), sans slave latency,
# timeout 1 s (unités de 10 ms)
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=100
